name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # pinned: Playwright 1.56 does not support the ubuntu-latest image (26.04); remove once it does
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce overlay freeze guard
        run: |
          if git diff --name-only origin/main... | grep -E '^(apps/web-mvc/Program.cs|apps/web-mvc/wwwroot/js/route-overlay.js)$'; then
            echo "Overlay freeze active: edits detected in overlay files." >&2
            exit 1
          fi
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Gate
        run: npm run typecheck

      - name: Playwright Meta Gate
        run: |
          set -euo pipefail
          : > meta-gate.txt
          npx playwright test tests/meta --reporter=list | tee meta-gate.txt
        env:
          CI: true

      - name: Playwright Meta Summary
        if: always()
        run: |
          {
            echo '### Playwright Meta Gate'
            echo '```'
            cat meta-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Meta Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-gate
          path: meta-gate.txt

      - name: Playwright E2E Gate
        run: npx playwright install --with-deps && npx playwright test
        env:
          CI: true

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: playwright-report

  nightly-scripts:
    # plan 47: export.gs, alarm.gs and keygen under fake Apps Script services (no database needed)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nightly script tests
        run: npm test
        working-directory: tools/nightly
